<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Minimal Mall</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/create_profile.css">
</head>
<body>
    <div class="app-bar">
        <i class="fa-solid fa-arrow-left app-bar-icon" onclick="history.back()"></i>
        <span class="app-bar-title">Edit Profile</span>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center py-5" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Loading profile...</p>
    </div>

    <div class="profile-container" id="profileContainer" style="display: none;">
        <h1 class="profile-title">Edit Your Profile</h1>

        <!-- Profile Photo Section -->
        <div class="photo-frame">
            <div style="text-align: center;">
                <div class="photo-placeholder" id="photoPreview" onclick="document.getElementById('photoInput').click()" style="cursor: pointer; overflow: hidden;">
                    <i class="fa-solid fa-image"></i>
                </div>
                <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" style="display: none;">
                <button type="button" class="btn btn-sm btn-outline-primary mt-2" onclick="document.getElementById('photoInput').click()">
                    <i class="fa-solid fa-camera me-1"></i> Change Photo
                </button>
                <small class="d-block text-muted mt-1">JPG, PNG or WEBP (Max 5MB)</small>
            </div>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <form class="profile-form" id="profileForm">
            <div>
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" id="fullName" class="form-input" placeholder="Display Name" required>
            </div>

            <div>
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-input" placeholder="Email Address" disabled readonly style="background-color: #f5f5f5; cursor: not-allowed;">
                <small class="text-muted">Email cannot be changed</small>
            </div>

            <div>
                <label class="form-label">Phone Number</label>
                <input type="tel" id="phoneNumber" class="form-input" placeholder="+63 XXX XXX XXXX">
            </div>

            <div>
                <label class="form-label">Gender</label>
                <select id="gender" class="form-select">
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer_not_to_say">Prefer not to say</option>
                </select>
            </div>

            <div>
                <label class="form-label">Date of Birth</label>
                <input type="date" id="dateOfBirth" class="form-input">
            </div>

            <div>
                <label class="form-label">Address</label>
                <textarea id="address" class="form-textarea" placeholder="Complete Address" rows="3"></textarea>
            </div>

            <div>
                <label class="form-label">Bio</label>
                <textarea id="bio" class="form-textarea" placeholder="Tell us about yourself..." rows="4"></textarea>
            </div>

            <button type="submit" class="btn-save" id="saveBtn">
                <i class="fa-solid fa-save me-2"></i>Save Changes
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/edit_profile.js"></script>
</body>
</html>
